name: Static quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Checks the built site in docs/, the directory GitHub Pages serves:
  # page structure, titles and descriptions, image alt text, internal
  # links and fragments, and a Content-Security-Policy <meta> on every
  # page. See tools/quality-check.py.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run static quality checks
        run: python3 tools/quality-check.py
